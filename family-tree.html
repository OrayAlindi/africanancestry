<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Family Tree Builder — African Ancestry</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900&family=Jost:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --gold: #C8922A; --amber: #E8B84B; --sienna: #8B3A1E;
      --cream: #F5EDD8; --sand: #C8AB88; --night: #0D0804;
      --muted: #7A6550; --card: #150D07; --border: rgba(200,146,42,0.18);
    }
    html, body { height: 100%; background: var(--night); color: var(--cream); font-family: 'Jost', sans-serif; overflow: hidden; }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 2.5rem;
      background: rgba(13,8,4,0.97);
      border-bottom: 1px solid var(--border);
    }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 900; color: var(--cream); text-decoration: none; }
    .logo span { color: var(--amber); }
    .nav-right { display: flex; align-items: center; gap: 1.5rem; }
    .nav-right a { font-size: 0.82rem; color: var(--sand); text-decoration: none; transition: color 0.2s; }
    .nav-right a:hover { color: var(--amber); }
    .btn-sm {
      background: var(--gold); color: var(--night);
      font-family: 'Space Mono', monospace; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      border: none; cursor: pointer; padding: 0.55rem 1.2rem;
      transition: background 0.2s; text-decoration: none; display: inline-block;
    }
    .btn-sm:hover { background: var(--amber); }

    /* ── LAYOUT ── */
    .app {
      display: grid; grid-template-columns: 320px 1fr;
      height: 100vh; padding-top: 57px;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem; font-weight: 700; margin-bottom: 0.3rem;
    }
    .sidebar-header p { font-size: 0.8rem; color: var(--muted); font-weight: 300; }
    .btn-add {
      display: flex; align-items: center; gap: 0.6rem;
      width: calc(100% - 3rem); margin: 1rem 1.5rem;
      background: var(--gold); color: var(--night);
      font-family: 'Space Mono', monospace; font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      border: none; cursor: pointer; padding: 0.85rem 1.2rem;
      transition: background 0.2s;
    }
    .btn-add:hover { background: var(--amber); }
    .member-list {
      flex: 1; overflow-y: auto; padding: 0 1.5rem 1.5rem;
    }
    .member-list::-webkit-scrollbar { width: 4px; }
    .member-list::-webkit-scrollbar-track { background: transparent; }
    .member-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .member-label {
      font-family: 'Space Mono', monospace; font-size: 0.6rem;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); margin: 1rem 0 0.6rem;
    }
    .member-card {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.75rem; margin-bottom: 0.4rem;
      background: rgba(255,255,255,0.02); border: 1px solid transparent;
      cursor: pointer; transition: all 0.2s;
    }
    .member-card:hover, .member-card.active {
      border-color: var(--border); background: rgba(200,146,42,0.06);
    }
    .member-avatar {
      width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Playfair Display', serif; font-size: 0.95rem; font-weight: 700;
      color: var(--night); overflow: hidden;
    }
    .member-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .member-info { flex: 1; min-width: 0; }
    .member-name { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .member-rel {
      font-family: 'Space Mono', monospace; font-size: 0.58rem;
      letter-spacing: 0.08em; color: var(--muted); margin-top: 0.15rem;
    }
    .member-del {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 1rem; padding: 0.2rem; opacity: 0; transition: opacity 0.2s, color 0.2s;
    }
    .member-card:hover .member-del { opacity: 1; }
    .member-del:hover { color: #D4500A; }

    /* ── CANVAS AREA ── */
    .canvas-area {
      position: relative; overflow: hidden; background: var(--night);
      background-image:
        radial-gradient(ellipse 70% 60% at 60% 40%, rgba(139,58,30,0.12) 0%, transparent 65%);
    }
    .canvas-tools {
      position: absolute; top: 1.2rem; right: 1.5rem; z-index: 10;
      display: flex; gap: 0.5rem;
    }
    .tool-btn {
      background: rgba(21,13,7,0.9); border: 1px solid var(--border); color: var(--sand);
      font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: 0.05em;
      padding: 0.5rem 0.9rem; cursor: pointer; transition: all 0.2s;
    }
    .tool-btn:hover { border-color: var(--gold); color: var(--amber); }
    #tree-canvas { width: 100%; height: 100%; }

    /* ── MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: rgba(13,8,4,0.85); backdrop-filter: blur(4px);
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1A0F07; border: 1px solid var(--border);
      width: 460px; max-width: 95vw; max-height: 90vh; overflow-y: auto;
      animation: modalIn 0.25s ease;
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .modal-header {
      padding: 1.5rem 2rem; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; }
    .modal-close {
      background: none; border: none; color: var(--muted); font-size: 1.4rem;
      cursor: pointer; transition: color 0.2s; line-height: 1;
    }
    .modal-close:hover { color: var(--cream); }
    .modal-body { padding: 2rem; }
    .form-row { margin-bottom: 1.2rem; }
    .form-row label {
      display: block; font-family: 'Space Mono', monospace;
      font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 0.5rem;
    }
    .form-row input, .form-row select, .form-row textarea {
      width: 100%; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(200,146,42,0.2); color: var(--cream);
      font-family: 'Jost', sans-serif; font-size: 0.9rem; font-weight: 300;
      padding: 0.75rem 1rem; outline: none; transition: border-color 0.25s;
      appearance: none;
    }
    .form-row select option { background: #1A0F07; }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--gold); }
    .form-row textarea { resize: vertical; min-height: 80px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* Photo upload */
    .photo-upload {
      border: 1px dashed rgba(200,146,42,0.3); padding: 1.5rem;
      text-align: center; cursor: pointer; transition: border-color 0.2s;
      position: relative;
    }
    .photo-upload:hover { border-color: var(--gold); }
    .photo-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .photo-upload-preview { width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 0.75rem; overflow: hidden; background: rgba(200,146,42,0.1); display: flex; align-items: center; justify-content: center; }
    .photo-upload-preview img { width: 100%; height: 100%; object-fit: cover; }
    .photo-upload p { font-size: 0.8rem; color: var(--muted); }
    .photo-upload span { font-family: 'Space Mono', monospace; font-size: 0.62rem; color: var(--gold); }

    .modal-footer {
      padding: 1.2rem 2rem; border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 1rem;
    }
    .btn-cancel {
      background: none; border: 1px solid var(--border); color: var(--sand);
      font-family: 'Space Mono', monospace; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0.7rem 1.4rem; cursor: pointer; transition: all 0.2s;
    }
    .btn-cancel:hover { border-color: var(--sand); color: var(--cream); }
    .btn-save {
      background: var(--gold); color: var(--night);
      font-family: 'Space Mono', monospace; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      border: none; padding: 0.7rem 1.8rem; cursor: pointer; transition: background 0.2s;
    }
    .btn-save:hover { background: var(--amber); }

    /* ── EMPTY STATE ── */
    .empty-state {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem;
      pointer-events: none;
    }
    .empty-state svg { opacity: 0.08; width: 120px; height: 120px; }
    .empty-state p { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-style: italic; color: var(--muted); }
    .empty-state span { font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: 0.15em; color: rgba(122,101,80,0.6); }

    /* ── TREE NODE (rendered on canvas) ── */
    .tree-svg { position: absolute; inset: 0; pointer-events: none; }
    .tree-wrapper { position: absolute; inset: 0; overflow: auto; }
    .tree-inner { position: relative; min-width: 100%; min-height: 100%; }

    .node {
      position: absolute; width: 130px;
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; transform: translate(-50%, -50%);
      transition: transform 0.2s;
      pointer-events: all;
    }
    .node:hover { transform: translate(-50%, -50%) scale(1.05); }
    .node-photo {
      width: 64px; height: 64px; border-radius: 50%;
      border: 2px solid var(--gold);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700;
      color: var(--night); overflow: hidden; margin-bottom: 0.5rem;
      box-shadow: 0 0 0 4px rgba(200,146,42,0.1);
    }
    .node-photo img { width: 100%; height: 100%; object-fit: cover; }
    .node-photo.root { width: 80px; height: 80px; border-width: 3px; font-size: 1.6rem; box-shadow: 0 0 0 6px rgba(200,146,42,0.15); }
    .node-name {
      font-size: 0.78rem; font-weight: 600; text-align: center;
      color: var(--cream); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .node-rel {
      font-family: 'Space Mono', monospace; font-size: 0.55rem;
      letter-spacing: 0.08em; color: var(--gold); margin-top: 0.2rem;
    }

    /* Tooltip */
    .tooltip {
      display: none; position: fixed; z-index: 300;
      background: #1A0F07; border: 1px solid var(--border);
      padding: 1rem 1.2rem; max-width: 220px;
      pointer-events: none;
    }
    .tooltip.show { display: block; }
    .tooltip-name { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; margin-bottom: 0.3rem; }
    .tooltip-meta { font-family: 'Space Mono', monospace; font-size: 0.6rem; color: var(--muted); margin-bottom: 0.5rem; }
    .tooltip-bio { font-size: 0.8rem; font-weight: 300; color: var(--sand); line-height: 1.6; }

    /* Export notice */
    .export-notice {
      display: none; position: fixed; bottom: 2rem; right: 2rem; z-index: 400;
      background: var(--gold); color: var(--night);
      font-family: 'Space Mono', monospace; font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.08em; padding: 0.9rem 1.5rem;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .sidebar { max-height: 40vh; }
      html, body { overflow: auto; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="logo">African <span>Ancestry</span></a>
  <div class="nav-right">
    <a href="#">Home</a>
    <a href="#">DNA Testing</a>
    <a href="#">Community</a>
    <button class="btn-sm" onclick="exportTree()">Export Tree</button>
  </div>
</nav>

<!-- APP -->
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Your Family Tree</h2>
      <p>Add members to grow your lineage</p>
    </div>
    <button class="btn-add" onclick="openModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Family Member
    </button>
    <div class="member-list" id="memberList">
      <div class="member-label">Your Tree</div>
      <!-- members rendered here -->
    </div>
  </div>

  <!-- CANVAS -->
  <div class="canvas-area" id="canvasArea">
    <div class="canvas-tools">
      <button class="tool-btn" onclick="zoomIn()">+ Zoom</button>
      <button class="tool-btn" onclick="zoomOut()">− Zoom</button>
      <button class="tool-btn" onclick="resetView()">Reset</button>
    </div>
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C8922A" stroke-width="1">
        <circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0116 0v2"/>
        <path d="M16 3.13a4 4 0 010 7.75"/><path d="M21 21v-2a4 4 0 00-3-3.85"/>
      </svg>
      <p>Your tree begins here</p>
      <span>Add your first family member to start</span>
    </div>
    <div class="tree-wrapper" id="treeWrapper">
      <div class="tree-inner" id="treeInner">
        <svg class="tree-svg" id="treeSVG"></svg>
      </div>
    </div>
  </div>

</div>

<!-- TOOLTIP -->
<div class="tooltip" id="tooltip">
  <div class="tooltip-name" id="ttName"></div>
  <div class="tooltip-meta" id="ttMeta"></div>
  <div class="tooltip-bio" id="ttBio"></div>
</div>

<!-- EXPORT NOTICE -->
<div class="export-notice" id="exportNotice">Tree exported as JSON ✓</div>

<!-- ADD MEMBER MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>Add Family Member</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">

      <!-- Photo upload -->
      <div class="form-row">
        <label>Photo (optional)</label>
        <div class="photo-upload" id="photoUploadArea">
          <input type="file" accept="image/*" id="photoInput" onchange="handlePhoto(event)"/>
          <div class="photo-upload-preview" id="photoPreview">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C8922A" stroke-width="1.5">
              <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
          </div>
          <p>Click to upload a photo</p>
          <span>JPG, PNG up to 5MB</span>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label>First Name *</label>
          <input type="text" id="fName" placeholder="e.g. Amara"/>
        </div>
        <div class="form-row">
          <label>Last Name</label>
          <input type="text" id="lName" placeholder="e.g. Osei"/>
        </div>
      </div>

      <div class="form-row">
        <label>Relationship to You *</label>
        <select id="relationship">
          <option value="">Select relationship...</option>
          <optgroup label="Parents">
            <option value="Father">Father</option>
            <option value="Mother">Mother</option>
            <option value="Stepfather">Stepfather</option>
            <option value="Stepmother">Stepmother</option>
          </optgroup>
          <optgroup label="Grandparents">
            <option value="Paternal Grandfather">Paternal Grandfather</option>
            <option value="Paternal Grandmother">Paternal Grandmother</option>
            <option value="Maternal Grandfather">Maternal Grandfather</option>
            <option value="Maternal Grandmother">Maternal Grandmother</option>
          </optgroup>
          <optgroup label="Siblings">
            <option value="Brother">Brother</option>
            <option value="Sister">Sister</option>
          </optgroup>
          <optgroup label="Children">
            <option value="Son">Son</option>
            <option value="Daughter">Daughter</option>
          </optgroup>
          <optgroup label="Extended">
            <option value="Uncle">Uncle</option>
            <option value="Aunt">Aunt</option>
            <option value="Cousin">Cousin</option>
            <option value="Great Grandfather">Great Grandfather</option>
            <option value="Great Grandmother">Great Grandmother</option>
            <option value="Nephew">Nephew</option>
            <option value="Niece">Niece</option>
            <option value="Spouse / Partner">Spouse / Partner</option>
          </optgroup>
          <optgroup label="Other">
            <option value="Myself">Myself (Root)</option>
            <option value="Other">Other</option>
          </optgroup>
        </select>
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label>Birth Year</label>
          <input type="text" id="birthYear" placeholder="e.g. 1952"/>
        </div>
        <div class="form-row">
          <label>Country / Region of Origin</label>
          <input type="text" id="origin" placeholder="e.g. Ghana, Ashanti"/>
        </div>
      </div>

      <div class="form-row">
        <label>Notes / Story</label>
        <textarea id="bio" placeholder="Any stories, memories or details about this person..."></textarea>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveMember()">Add to Tree</button>
    </div>
  </div>
</div>

<script>
  // ── STATE ──
  let members = JSON.parse(localStorage.getItem('aa_tree') || '[]');
  let currentPhoto = null;
  let zoom = 1;
  const COLORS = ['#C8922A','#8B3A1E','#5A7A3A','#2A5A7A','#7A2A5A','#3A5A2A'];

  // ── INIT ──
  renderAll();

  // ── MODAL ──
  function openModal() {
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('fName').focus();
    currentPhoto = null;
    document.getElementById('photoPreview').innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C8922A" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`;
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    clearForm();
  }
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });

  function clearForm() {
    ['fName','lName','birthYear','origin','bio'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('relationship').value = '';
    currentPhoto = null;
  }

  // ── PHOTO ──
  function handlePhoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      currentPhoto = ev.target.result;
      document.getElementById('photoPreview').innerHTML = `<img src="${currentPhoto}" alt="preview"/>`;
    };
    reader.readAsDataURL(file);
  }

  // ── SAVE MEMBER ──
  function saveMember() {
    const fName = document.getElementById('fName').value.trim();
    const rel   = document.getElementById('relationship').value;
    if (!fName || !rel) {
      alert('Please enter a name and relationship.');
      return;
    }
    const member = {
      id: Date.now(),
      firstName: fName,
      lastName:  document.getElementById('lName').value.trim(),
      relationship: rel,
      birthYear: document.getElementById('birthYear').value.trim(),
      origin:    document.getElementById('origin').value.trim(),
      bio:       document.getElementById('bio').value.trim(),
      photo:     currentPhoto,
      color:     COLORS[members.length % COLORS.length]
    };
    members.push(member);
    save();
    renderAll();
    closeModal();
  }

  // ── DELETE ──
  function deleteMember(id, e) {
    e.stopPropagation();
    if (!confirm('Remove this person from your tree?')) return;
    members = members.filter(m => m.id !== id);
    save();
    renderAll();
  }

  // ── SAVE TO LOCALSTORAGE ──
  function save() {
    localStorage.setItem('aa_tree', JSON.stringify(members));
  }

  // ── RENDER ALL ──
  function renderAll() {
    renderSidebar();
    renderTree();
    document.getElementById('emptyState').style.display = members.length ? 'none' : 'flex';
  }

  // ── RENDER SIDEBAR ──
  function renderSidebar() {
    const list = document.getElementById('memberList');
    list.innerHTML = '<div class="member-label">Your Tree (' + members.length + ')</div>';
    members.forEach(m => {
      const initials = (m.firstName[0] + (m.lastName ? m.lastName[0] : '')).toUpperCase();
      const div = document.createElement('div');
      div.className = 'member-card';
      div.innerHTML = `
        <div class="member-avatar" style="background:${m.color}">
          ${m.photo ? `<img src="${m.photo}" alt="${m.firstName}"/>` : initials}
        </div>
        <div class="member-info">
          <div class="member-name">${m.firstName} ${m.lastName}</div>
          <div class="member-rel">${m.relationship}${m.origin ? ' · ' + m.origin : ''}</div>
        </div>
        <button class="member-del" onclick="deleteMember(${m.id}, event)" title="Remove">×</button>
      `;
      list.appendChild(div);
    });
  }

  // ── RENDER TREE ──
  function renderTree() {
    const inner = document.getElementById('treeInner');
    const svg   = document.getElementById('treeSVG');

    // Remove old nodes
    inner.querySelectorAll('.node').forEach(n => n.remove());
    svg.innerHTML = '';

    if (!members.length) return;

    // Layout: simple generational layout based on relationship
    const genMap = {
      'Great Grandfather': 0, 'Great Grandmother': 0,
      'Paternal Grandfather': 1, 'Paternal Grandmother': 1,
      'Maternal Grandfather': 1, 'Maternal Grandmother': 1,
      'Father': 2, 'Mother': 2, 'Stepfather': 2, 'Stepmother': 2,
      'Uncle': 2, 'Aunt': 2,
      'Myself': 3, 'Spouse / Partner': 3,
      'Brother': 3, 'Sister': 3,
      'Cousin': 3,
      'Son': 4, 'Daughter': 4,
      'Nephew': 4, 'Niece': 4,
      'Other': 3
    };

    // Group by generation
    const gens = {};
    members.forEach(m => {
      const g = genMap[m.relationship] !== undefined ? genMap[m.relationship] : 3;
      if (!gens[g]) gens[g] = [];
      gens[g].push(m);
    });

    const GEN_HEIGHT = 180;
    const NODE_WIDTH = 160;
    const PADDING_X  = 100;
    const PADDING_Y  = 80;
    const positions  = {};

    const genKeys = Object.keys(gens).map(Number).sort((a,b)=>a-b);
    const maxInGen = Math.max(...genKeys.map(g => gens[g].length));
    const canvasW = Math.max(900, maxInGen * NODE_WIDTH + PADDING_X * 2);
    const canvasH = genKeys.length * GEN_HEIGHT + PADDING_Y * 2;

    inner.style.width  = canvasW + 'px';
    inner.style.height = canvasH + 'px';
    svg.setAttribute('width',  canvasW);
    svg.setAttribute('height', canvasH);
    svg.style.width  = canvasW + 'px';
    svg.style.height = canvasH + 'px';

    genKeys.forEach((g, gi) => {
      const row = gens[g];
      const y = PADDING_Y + gi * GEN_HEIGHT;
      row.forEach((m, i) => {
        const totalW = row.length * NODE_WIDTH;
        const startX = (canvasW - totalW) / 2 + NODE_WIDTH / 2;
        const x = startX + i * NODE_WIDTH;
        positions[m.id] = { x, y };
        createNode(m, x, y, inner);
      });
    });

    // Draw connecting lines
    members.forEach(m => {
      const childG  = genMap[m.relationship] !== undefined ? genMap[m.relationship] : 3;
      const parentGs = [childG - 1];
      parentGs.forEach(pg => {
        if (!gens[pg]) return;
        gens[pg].forEach(parent => {
          drawLine(svg, positions[parent.id], positions[m.id]);
        });
      });
    });
  }

  function createNode(m, x, y, container) {
    const isRoot = m.relationship === 'Myself';
    const initials = (m.firstName[0] + (m.lastName ? m.lastName[0] : '')).toUpperCase();
    const div = document.createElement('div');
    div.className = 'node';
    div.style.left = x + 'px';
    div.style.top  = y + 'px';
    div.innerHTML = `
      <div class="node-photo ${isRoot ? 'root' : ''}" style="background:${m.color}">
        ${m.photo ? `<img src="${m.photo}" alt="${m.firstName}"/>` : initials}
      </div>
      <div class="node-name">${m.firstName} ${m.lastName || ''}</div>
      <div class="node-rel">${m.relationship}</div>
    `;
    div.addEventListener('mouseenter', e => showTooltip(e, m));
    div.addEventListener('mouseleave', hideTooltip);
    div.addEventListener('mousemove', moveTooltip);
    container.appendChild(div);
  }

  function drawLine(svg, from, to) {
    if (!from || !to) return;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const mx = (from.x + to.x) / 2;
    const my = (from.y + to.y) / 2;
    line.setAttribute('d', `M${from.x},${from.y} C${from.x},${my} ${to.x},${my} ${to.x},${to.y}`);
    line.setAttribute('stroke', 'rgba(200,146,42,0.25)');
    line.setAttribute('stroke-width', '1.5');
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke-dasharray', '4 3');
    svg.appendChild(line);
  }

  // ── TOOLTIP ──
  let ttX = 0, ttY = 0;
  function showTooltip(e, m) {
    const tt = document.getElementById('tooltip');
    document.getElementById('ttName').textContent = m.firstName + ' ' + (m.lastName || '');
    document.getElementById('ttMeta').textContent =
      [m.relationship, m.birthYear ? 'b. ' + m.birthYear : '', m.origin].filter(Boolean).join(' · ');
    document.getElementById('ttBio').textContent = m.bio || '';
    tt.classList.add('show');
    moveTooltip(e);
  }
  function moveTooltip(e) {
    const tt = document.getElementById('tooltip');
    tt.style.left = (e.clientX + 16) + 'px';
    tt.style.top  = (e.clientY + 16) + 'px';
  }
  function hideTooltip() {
    document.getElementById('tooltip').classList.remove('show');
  }

  // ── ZOOM ──
  function zoomIn()  { zoom = Math.min(zoom + 0.15, 2);   applyZoom(); }
  function zoomOut() { zoom = Math.max(zoom - 0.15, 0.4); applyZoom(); }
  function resetView() { zoom = 1; applyZoom(); }
  function applyZoom() {
    document.getElementById('treeInner').style.transform = `scale(${zoom})`;
    document.getElementById('treeInner').style.transformOrigin = 'top left';
  }

  // ── EXPORT ──
  function exportTree() {
    if (!members.length) { alert('Add some family members first!'); return; }
    const data = JSON.stringify(members, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'african-ancestry-tree.json';
    a.click(); URL.revokeObjectURL(url);
    const notice = document.getElementById('exportNotice');
    notice.style.display = 'block';
    setTimeout(() => notice.style.display = 'none', 3000);
  }
</script>
</body>
